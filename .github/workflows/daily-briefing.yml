name: 아침 증시 브리핑

# 매일 아침 07:00 KST 실행.
# GitHub Actions 의 cron 은 UTC 기준 → 07:00 KST = 22:00 UTC (전일).
# 평일 장 기준으로 월~금(KST) 발송: UTC 로는 일~목(0-4) 22:00.
on:
  schedule:
    - cron: "0 22 * * 0-4"
  workflow_dispatch:        # 수동 실행 버튼

jobs:
  briefing:
    runs-on: ubuntu-latest
    timeout-minutes: 20        # 웹검색 리서치(effort:high)는 수 분 소요
    permissions:
      contents: write        # 회신 기반 portfolio.yaml 변경사항 커밋용
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: 의존성 설치
        run: pip install -r requirements.txt

      - name: 브리핑 생성 및 발송
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
          MAIL_TO: ${{ secrets.MAIL_TO }}
          MAIL_FROM_NAME: ${{ secrets.MAIL_FROM_NAME }}
          IMAP_HOST: ${{ secrets.IMAP_HOST }}
          IMAP_PORT: ${{ secrets.IMAP_PORT }}
          IMAP_USER: ${{ secrets.IMAP_USER }}
          IMAP_PASSWORD: ${{ secrets.IMAP_PASSWORD }}
          KAKAO_REST_API_KEY: ${{ secrets.KAKAO_REST_API_KEY }}
          KAKAO_REFRESH_TOKEN: ${{ secrets.KAKAO_REFRESH_TOKEN }}
          KAKAO_LINK_URL: ${{ secrets.KAKAO_LINK_URL }}
        run: python main.py

      - name: 보유종목 변경사항 커밋 (이메일 회신 반영 시)
        run: |
          if ! git diff --quiet config/portfolio.yaml; then
            git config user.name "stockmachine-bot"
            git config user.email "actions@users.noreply.github.com"
            git add config/portfolio.yaml
            git commit -m "chore: 이메일 회신 기반 보유종목 자동 업데이트 [skip ci]"
            git push
          else
            echo "포트폴리오 변경 없음"
          fi
