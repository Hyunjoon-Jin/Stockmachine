name: 아침 증시 브리핑

# 비용 문제로 자동 스케줄 비활성화 (2026-07-24).
# 필요하면 Actions 탭에서 수동 실행(workflow_dispatch)은 계속 가능.
# 재활성화하려면 아래 schedule 블록의 주석을 해제할 것:
#   schedule:
#     - cron: "0 21 * * 0-4"   # 매일 아침 06:00 KST (UTC 21:00 전일, 평일 월~금)
on:
  workflow_dispatch:        # 수동 실행 버튼

jobs:
  briefing:
    runs-on: ubuntu-latest
    timeout-minutes: 35        # 웹검색 리서치(effort:high)+상세추천+재시도 여유
    permissions:
      contents: write        # 회신 기반 portfolio.yaml 변경사항 커밋용
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: 의존성 설치
        run: pip install -r requirements.txt

      - name: 브리핑 생성 및 발송
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
          MAIL_TO: ${{ secrets.MAIL_TO }}
          MAIL_FROM_NAME: ${{ secrets.MAIL_FROM_NAME }}
          IMAP_HOST: ${{ secrets.IMAP_HOST }}
          IMAP_PORT: ${{ secrets.IMAP_PORT }}
          IMAP_USER: ${{ secrets.IMAP_USER }}
          IMAP_PASSWORD: ${{ secrets.IMAP_PASSWORD }}
          KAKAO_REST_API_KEY: ${{ secrets.KAKAO_REST_API_KEY }}
          KAKAO_REFRESH_TOKEN: ${{ secrets.KAKAO_REFRESH_TOKEN }}
          KAKAO_CLIENT_SECRET: ${{ secrets.KAKAO_CLIENT_SECRET }}
          KAKAO_LINK_URL: ${{ secrets.KAKAO_LINK_URL }}
        run: python main.py

      - name: 보유종목 변경사항 커밋 (이메일 회신 반영 시)
        run: |
          if ! git diff --quiet config/portfolio.yaml; then
            git config user.name "stockmachine-bot"
            git config user.email "actions@users.noreply.github.com"
            git add config/portfolio.yaml
            git commit -m "chore: 이메일 회신 기반 보유종목 자동 업데이트 [skip ci]"
            git push
          else
            echo "포트폴리오 변경 없음"
          fi
